name: Integration

on:
  push:
    branches: ["main"]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26"

      - name: Integration tests
        env:
          NETNOD_API_TOKEN: ${{ secrets.NETNOD_API_TOKEN }}
          NETNOD_TEST_ZONE: ${{ secrets.NETNOD_TEST_ZONE }}
        run: go test -tags=integration -run 'TestIntegration_' -v -count=1 -race ./...
